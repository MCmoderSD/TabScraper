<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Tab Scraper</title>
    <link rel="stylesheet" href="../style/popup.css"/>
</head>
<body>
<main class="container">
    <fieldset>
        <legend>Filter Tabs</legend>

        <label for="prefix">Prefix
            <input type="text" id="prefix" placeholder="e.g. https://" autocomplete="off" spellcheck="false"/>
        </label>

        <label for="suffix">Suffix
            <input type="text" id="suffix" placeholder="e.g. .png" autocomplete="off" spellcheck="false"/>
        </label>

        <label for="regex">Regex
            <input type="text" id="regex" placeholder="e.g. \.com$" autocomplete="off" spellcheck="false"/>
        </label>

        <div class="checkbox-row">
            <input type="checkbox" id="invert"/>
            <label for="invert">Invert Selection</label>
        </div>
    </fieldset>

    <button type="button" id="scrape">Scrape Tabs</button>

    <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="/dist/popup.js"></script>
</body>
</html>
